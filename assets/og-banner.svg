<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowCyan" cx="85%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#00b8be" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00b8be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="5%" cy="110%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e5a0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0b90b"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="65%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="creditGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#b794f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#070a12"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowViolet)"/>

  <!-- Candlestick motif (right side) -->
  <g opacity="0.55">
    <rect x="950" y="300" width="18" height="110" rx="3" fill="#00e5a0"/>
    <line x1="959" y1="270" x2="959" y2="430" stroke="#00e5a0" stroke-width="3"/>
    <rect x="985" y="330" width="18" height="80" rx="3" fill="#ff3d71"/>
    <line x1="994" y1="305" x2="994" y2="440" stroke="#ff3d71" stroke-width="3"/>
    <rect x="1020" y="250" width="18" height="130" rx="3" fill="#00e5a0"/>
    <line x1="1029" y1="225" x2="1029" y2="410" stroke="#00e5a0" stroke-width="3"/>
    <rect x="1055" y="210" width="18" height="95" rx="3" fill="#00e5a0"/>
    <line x1="1064" y1="185" x2="1064" y2="330" stroke="#00e5a0" stroke-width="3"/>
    <rect x="1090" y="240" width="18" height="60" rx="3" fill="#f0b90b"/>
    <line x1="1099" y1="218" x2="1099" y2="330" stroke="#f0b90b" stroke-width="3"/>
  </g>

  <!-- Trend line -->
  <polyline points="880,430 940,390 985,420 1030,320 1070,280 1130,240"
            fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="1130" cy="240" r="6" fill="#00e5ff"/>
  <circle cx="1130" cy="240" r="12" fill="none" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Pair chip -->
  <rect x="90" y="110" width="220" height="52" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="118" cy="136" r="8" fill="#f0b90b"/>
  <text x="138" y="143" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="url(#goldGrad)">XAUUSD · GOLD</text>

  <!-- Title -->
  <text x="90" y="250" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#titleGrad)">SMC Liquidity Hunting</text>
  <text x="90" y="330" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#titleGrad)">AI Lab</text>

  <!-- Subtitle -->
  <text x="90" y="385" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="#8b98a9">Institutional Forex &amp; Gold Signals · Smart Money Concepts</text>

  <!-- Feature chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="90" y="420" width="150" height="44" rx="22" fill="rgba(255,176,32,0.12)" stroke="#ffb020" stroke-width="1.5"/>
    <text x="122" y="449" fill="#ffb020">BSL / SSL</text>
    <rect x="256" y="420" width="190" height="44" rx="22" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
    <text x="286" y="449" fill="#10b981">Order Blocks</text>
    <rect x="462" y="420" width="100" height="44" rx="22" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="494" y="449" fill="#38bdf8">FVG</text>
    <rect x="578" y="420" width="230" height="44" rx="22" fill="rgba(0,229,255,0.10)" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="604" y="449" fill="#00e5ff">Live SMC Analysis</text>
  </g>

  <!-- Divider + credit -->
  <rect x="90" y="510" width="420" height="2" fill="url(#dividerGrad)"/>
  <text x="90" y="560" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="url(#creditGrad)">Organized and Analyzed by Amanat Ullah</text>

  <!-- Bottom-right bilingual tag -->
  <text x="1110" y="590" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8b98a9">EN / বাংলা · smc-lab-eight.vercel.app</text>
</svg>
